
<!DOCTYPE html>
<html>
<head>

<title>ParkVision Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
}

.header {
    background: #1e293b;
    color: white;
    padding: 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.container {
    width: 90%;
    margin: 25px auto;
}

.stats {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    width: 200px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.card h2 {
    margin: 5px;
    font-size: 32px;
}

.total {
    color: #2563eb;
}

.red {
    color: #dc2626;
}

.green {
    color: #16a34a;
}

.image-box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.image-box img {
    width: 100%;
    max-width: 1000px;
    border-radius: 8px;
}

.slots {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 25px;
}

.slot {
    width: 150px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    color: white;
}

.slot h3 {
    margin: 5px;
}

.slot p {
    margin: 5px;
    font-weight: bold;
}

.occupied {
    background: #dc2626;
}

.vacant {
    background: #16a34a;
}

.available {
    background: white;
    padding: 20px;
    margin-top: 25px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.available h2 {
    color: #16a34a;
}

</style>

</head>

<body>

<div class="header">
    <h1>🚗 ParkVision</h1>
    <p>Smart Parking Occupancy Dashboard</p>
</div>

<div class="container">

    <div class="stats">

        <div class="card">
            <h3>Total Slots</h3>
            <h2 class="total">5</h2>
        </div>

        <div class="card">
            <h3>Occupied</h3>
            <h2 class="red">3</h2>
        </div>

        <div class="card">
            <h3>Vacant</h3>
            <h2 class="green">2</h2>
        </div>

    </div>

    <div class="image-box">

        <h2>Parking Lot Analysis</h2>

        <img src="occupancy_result.jpg">

    </div>

    <div class="available">

        <h2>Available Parking Slots</h2>

        <h3>Slot 3, Slot 4</h3>

    </div>

    <div class="slots">

        
        <div class="slot occupied">
            <h3>Slot 1</h3>
            <p>OCCUPIED</p>
        </div>
        
        <div class="slot occupied">
            <h3>Slot 2</h3>
            <p>OCCUPIED</p>
        </div>
        
        <div class="slot vacant">
            <h3>Slot 3</h3>
            <p>VACANT</p>
        </div>
        
        <div class="slot vacant">
            <h3>Slot 4</h3>
            <p>VACANT</p>
        </div>
        
        <div class="slot occupied">
            <h3>Slot 5</h3>
            <p>OCCUPIED</p>
        </div>
        

    </div>

</div>

</body>
</html>
